# ai-radar 项目配置文件（改完保存并重跑脚本即生效，不需要改 Python 代码）
# 注意：YAML 缩进必须用空格（本文件统一 2 空格），绝不能按 Tab 键

project:
  name: ai-radar
  data_dir: data
  output_dir: output

model_pricing:
  snapshot_file: openrouter-models-2026-11-24.json
  exchange_rate: 7.2
  top_n: 5
  exclude_prefixes:
    - "~"
  exclude_suffixes:
    - ":free"
    - ":batch"

daily_briefing:
  snapshot_file: hn-frontpage-2026-11-24.json
  output_file: daily-briefing.md
  min_points: 50
  max_items: 8
  keywords:
    - ai
    - llm
    - model
    - nvidia
    - oss
    - openai
    - anthropic
    - dario
    - deepseek
    - agent
